name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # development runs .ts directly: Node >= 22.18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The published dist/ supports Node >= 18: build on 24, then run it on the older runtimes.
  runtime:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: MCP handshake on dist/
        run: |
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | timeout 10 node dist/cli.js)
          echo "$out"
          echo "$out" | grep -q '"name":"graph-excel"'

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Claude Desktop extension packs and validates
        run: npm run pack
      - name: plugin/ is up to date with src/
        run: |
          if ! git diff --exit-code -- plugin || [ -n "$(git status --porcelain -- plugin)" ]; then
            echo "plugin/ is stale - run npm run pack and commit it"
            exit 1
          fi
