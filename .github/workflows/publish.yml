name: Publish

# Push a tag vX.Y.Z (matching package.json) to publish to npm and attach the .mcpb to a GitHub release.
# npm side: the package's Trusted Publisher must point at this repo and this workflow file (publish.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release with the .mcpb
  id-token: write # npm trusted publishing (OIDC): no token, no OTP, provenance attached

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@^11.5.1
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Build .mcpb and check plugin/ is up to date
        run: |
          npm run pack
          if ! git diff --exit-code -- plugin || [ -n "$(git status --porcelain -- plugin)" ]; then
            echo "plugin/ is stale - run npm run pack and commit it"
            exit 1
          fi
      - run: npm publish --access public
      - name: GitHub release with the Claude Desktop extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.mcpb --title "$GITHUB_REF_NAME" --generate-notes
      # Official MCP Registry: after npm, since the registry checks the npm package's mcpName. GitHub OIDC, no secret.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
